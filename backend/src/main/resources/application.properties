# Name der Spring-Boot-Anwendung und HTTP-Port des eingebetteten Webservers.
spring.application.name=backend
server.port=8081

# Verbindung zur lokalen PostgreSQL-Datenbank team_workspace.
spring.datasource.url=jdbc:postgresql://localhost:5432/team_workspace
spring.datasource.username=postgres
# Das Passwort wird aus der Umgebungsvariable DB_PASSWORD gelesen.
spring.datasource.password=${DB_PASSWORD}

# Hibernate gleicht das Datenbankschema beim Start mit den JPA-Entitäten ab.
spring.jpa.hibernate.ddl-auto=update
# Gibt die ausgeführten SQL-Anweisungen zur Nachverfolgung in der Konsole aus.
spring.jpa.show-sql=true

# JWT-Signierschlüssel: mindestens 32 zufällige Bytes, als Base64 in JWT_SECRET übergeben.
jwt.secret=${JWT_SECRET}
# Lebensdauer der beim Login ausgestellten Tokens: eine Stunde.
jwt.expiration-seconds=3600
